name: Update Plugin Cache

on:  
  push:
    paths: 
      - 'community made plugins/**'
      - '.github/workflows/update-plugin-cache.yml'
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

permissions:
  contents:  write

jobs:
  update-cache:
    runs-on:  ubuntu-latest
    steps: 
      - name: Checkout repository
        uses:  actions/checkout@v4
        with:
          fetch-depth:  0  # Full history for commit data
      
      - name:  Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Generate Plugin Cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create docs/public directory if it doesn't exist
          mkdir -p docs/public
          
          # Generate cache using Node.js
          node << 'SCRIPT_END'
          const fs = require('fs');
          const https = require('https');
          
          const REPO_OWNER = 'TheCrazy8';
          const REPO_NAME = 'Blaze-Official';
          const PLUGINS_PATH = 'community made plugins';
          
          function httpsGet(url) {
            return new Promise((resolve, reject) => {
              const options = {
                headers: {
                  'User-Agent': 'BrightOS-Cache-Generator',
                  'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
                  'Accept': 'application/vnd.github.v3+json'
                }
              };
              
              https.get(url, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    try {
                      resolve(JSON.parse(data));
                    } catch (e) {
                      resolve(data);
                    }
                  } else {
                    reject(new Error('HTTP ' + res.statusCode + ': ' + data));
                  }
                });
              }).on('error', reject);
            });
          }
          
          function httpsGetRaw(url) {
            return new Promise((resolve, reject) => {
              const options = {
                headers:  {
                  'User-Agent': 'BrightOS-Cache-Generator'
                }
              };
              
              https.get(url, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    resolve(data);
                  } else {
                    reject(new Error('HTTP ' + res.statusCode));
                  }
                });
              }).on('error', reject);
            });
          }
          
          async function fetchPlugins() {
            console.log('Fetching plugins from GitHub...');
            
            try {
              const files = await httpsGet(
                'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + encodeURIComponent(PLUGINS_PATH)
              );
              
              console.log('Files received:', files.length);
              
              const pluginFiles = files.filter(f => f.name.endsWith('.py') && f.type === 'file');
              console.log('Found ' + pluginFiles.length + ' plugin files');
              
              const plugins = [];
              
              for (const file of pluginFiles) {
                console.log('Processing ' + file.name + '...');
                
                try {
                  const content = await httpsGetRaw(file.download_url);
                  
                  const commits = await httpsGet(
                    'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/commits?path=' + encodeURIComponent(PLUGINS_PATH + '/' + file.name) + '&per_page=100'
                  );
                  
                  const contributors = Array.from(new Set(commits.map(c => c.author && c.author.login).filter(Boolean)));
                  
                  const classMatch = content.match(/class\s+(\w+)\s*\(/i);
                  const className = classMatch ? classMatch[1] : file.name.replace('.py', '');
                  
                  const docstringMatch = content.match(/"""([\s\S]*?)"""/m);
                  const docstring = docstringMatch ? docstringMatch[1].trim() : '';
                  
                  const descriptionLines = docstring.split('\n').filter(line => line.trim());
                  const shortDescription = descriptionLines[0] || 'No description available';
                  
                  const functions = [];
                  const functionRegex = /def\s+(\w+)\s*\([^)]*\):/g;
                  let match;
                  while ((match = functionRegex.exec(content)) !== null) {
                    if (! match[1].startsWith('_')) {
                      functions.push(match[1]);
                    }
                  }
                  
                  const contentLower = content.toLowerCase();
                  let category = 'Utilities';
                  if (contentLower.includes('motor') || contentLower.includes('servo')) {
                    category = 'Motor Control';
                  } else if (contentLower.includes('sensor')) {
                    category = 'Sensors';
                  } else if (contentLower.includes('display') || contentLower.includes('led')) {
                    category = 'Display';
                  } else if (contentLower.includes('serial') || contentLower.includes('communication')) {
                    category = 'Communication';
                  }
                  
                  const lineCount = content.split('\n').length;
                  let difficulty = 'Beginner';
                  if (lineCount > 200) {
                    difficulty = 'Advanced';
                  } else if (lineCount > 100) {
                    difficulty = 'Intermediate';
                  }
                  
                  const tags = [];
                  if (contentLower.includes('servo')) tags.push('servo');
                  if (contentLower.includes('motor')) tags.push('motor');
                  if (contentLower.includes('dc motor') || contentLower.includes('dc-motor')) tags.push('dc-motor');
                  if (contentLower.includes('stepper')) tags.push('stepper');
                  if (contentLower.includes('sensor')) tags.push('sensor');
                  if (contentLower.includes('pwm')) tags.push('pwm');
                  
                  const hardware = [];
                  if (content.includes('TelemetrixUnoR4WiFi')) hardware.push('Arduino Uno R4 WiFi');
                  if (content.includes('Uno') && hardware.indexOf('Arduino Uno R4 WiFi') === -1) hardware.push('Arduino Uno');
                  if (content.includes('Mega')) hardware.push('Arduino Mega');
                  if (hardware.length === 0) hardware.push('Any Arduino');
                  
                  const dependencies = [];
                  if (content.includes('telemetrix')) dependencies.push('telemetrix-uno-r4-wifi');
                  if (content.includes('simple_plugin_loader')) dependencies.push('simple-plugin-loader');
                  
                  let qualityScore = 0;
                  const hasDocstring = content.includes('"""');
                  const hasExamples = contentLower.includes('example');
                  const hasTypeHints = content.includes(': ') && content.includes('->');
                  const hasErrorHandling = content.includes('try:') || content.includes('except');
                  const hasLogging = content.includes('print') || content.includes('log');
                  
                  if (hasDocstring) qualityScore += 15;
                  if (hasExamples) qualityScore += 10;
                  if (hasTypeHints) qualityScore += 5;
                  if (hasErrorHandling) qualityScore += 15;
                  if (hasLogging) qualityScore += 5;
                  if (lineCount > 50 && lineCount < 500) qualityScore += 10;
                  
                  const commitBonus = Math.min(commits.length * 2, 20);
                  const contributorBonus = Math.min(contributors.length * 10, 20);
                  qualityScore += commitBonus + contributorBonus;
                  qualityScore = Math.min(qualityScore, 100);
                  
                  const rating = (3.5 + (qualityScore / 100) * 1.5).toFixed(1);
                  
                  const versionMatch = content.match(/version\s*=\s*['"]([^'"]+)['"]/i) ||
                                       content.match(/@version\s+([^\s]+)/i) ||
                                       content.match(/__version__\s*=\s*['"]([^'"]+)['"]/i);
                  const version = versionMatch ?  versionMatch[1] : '1.' + commits.length + '.0';
                  
                  const lastUpdated = commits[0] && commits[0].commit && commits[0].commit.author && commits[0].commit.author.date
                    ? new Date(commits[0].commit.author.date).toISOString().split('T')[0]
                    : new Date().toISOString().split('T')[0];
                  
                  const changelog = [];
                  if (commits.length > 0 && commits[0].commit) {
                    changelog.push({
                      version:  '1.' + commits.length + '.0',
                      date: new Date(commits[0].commit.author.date).toISOString().split('T')[0],
                      changes: commits[0].commit.message,
                      author: commits[0].commit.author.name
                    });
                  } else {
                    changelog.push({
                      version: '1.0.0',
                      date: new Date().toISOString().split('T')[0],
                      changes: 'Initial release'
                    });
                  }
                  
                  plugins.push({
                    id: file.sha,
                    name: className,
                    filename: file.name,
                    version:  version,
                    author: contributors[0] || REPO_OWNER,
                    contributors:  contributors,
                    description: shortDescription,
                    longDescription: docstring,
                    rating: parseFloat(rating),
                    category:  category,
                    difficulty: difficulty,
                    tags: tags.slice(0, 5),
                    hardware: hardware,
                    dependencies: dependencies,
                    functions: functions,
                    lastUpdated: lastUpdated,
                    downloadUrl: file.download_url,
                    githubUrl: file.html_url,
                    size: file.size,
                    commitCount: commits.length,
                    lineCount: lineCount,
                    changelog: changelog
                  });
                  
                  console.log('✓ Processed ' + className);
                } catch (err) {
                  console.error('✗ Error processing ' + file.name + ':', err.message);
                }
              }
              
              const repoStats = await httpsGet('https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME);
              
              const cache = {
                generated_at: new Date().toISOString(),
                version: '1.0',
                repository: {
                  owner: REPO_OWNER,
                  name: REPO_NAME,
                  stars: repoStats.stargazers_count,
                  forks: repoStats.forks_count,
                  watchers: repoStats.watchers_count
                },
                plugins: plugins
              };
              
              fs.writeFileSync('docs/public/plugins-cache.json', JSON.stringify(cache, null, 2));
              console.log('\n✓ Cache generated with ' + plugins.length + ' plugins');
              console.log('✓ Saved to docs/public/plugins-cache.json');
              
            } catch (err) {
              console.error('Fatal error:', err);
              console.error('Stack:', err.stack);
              process.exit(1);
            }
          }
          
          fetchPlugins();
          SCRIPT_END
      
      - name:  Commit and push cache
        run:  |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Check if file exists before adding
          if [ -f docs/public/plugins-cache.json ]; then
            git add docs/public/plugins-cache.json
            
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "chore: update plugin cache [skip ci]"
              git push
            fi
          else
            echo "ERROR: Cache file was not generated!"
            exit 1
          fi
